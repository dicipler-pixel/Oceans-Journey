<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean's Yard Adventure V2</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#9bcbe6;font-family:system-ui,sans-serif}.card{background:white;padding:22px;border-radius:18px;text-align:center;max-width:420px;margin:20px}.small{font-size:13px;color:#555}</style></head><body><div class="card"><h2>Ocean's Yard Adventure</h2><p id="status">Loading the known-good V2…</p><p class="small">Please keep this page open for a moment.</p></div><script>(async()=>{try{const names=['part01.txt','part02.txt','part03.txt','part04.txt'];const parts=await Promise.all(names.map(n=>fetch('v2/'+n+'?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('This browser needs Chrome or Edge to open the game.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Could not load V2: '+e.message;console.error(e)}})();</script></body></html>
